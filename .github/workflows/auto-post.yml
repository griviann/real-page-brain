name: Real Satisfaction Autopilot V11 - BREAKTHROUGH
on:
  workflow_dispatch:
  push:
    paths:
      - 'post_instruction.json'
  schedule:
    - cron: '*/30 * * * *'

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node V11
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Deps
        run: npm install axios form-data || npm init -y && npm install axios form-data
        
      - name: Run V11 Brain
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const axios = require('axios');
          
          (async () => {
            try {
              let instruction = {};
              if (fs.existsSync('post_instruction.json')) {
                instruction = JSON.parse(fs.readFileSync('post_instruction.json','utf8'));
              }
              console.log('V11 Instruction:', instruction);
              
              if (!instruction.message) {
                console.log('No message, using auto-intel');
                instruction.message = `🔥 REAL SATISFACTION - V11 BREAKTHROUGH!\n\nKoti safi na bei poa! DM for orders Eldoret/Nakuru/Nairobi.\n#RealSatisfaction #Kenya`;
              }
              
              const pageId = process.env.FB_PAGE_ID;
              const token = process.env.FB_PAGE_TOKEN;
              
              if (!pageId || !token) {
                console.log('Missing FB secrets - check Settings > Secrets');
                return;
              }
              
              const url = `https://graph.facebook.com/${pageId}/feed`;
              const res = await axios.post(url, {
                message: instruction.message,
                access_token: token
              });
              console.log('POSTED SUCCESS:', res.data);
            } catch (e) {
              console.error('V11 Error:', e.response?.data || e.message);
              process.exit(1);
            }
          })();
          EOF
