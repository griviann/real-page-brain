name: Real Satisfaction Autopilot V8 AI
on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 9 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
jobs:
  autopilot:
    runs-on: ubuntu-latest
    env:
      PAGE_ID: ${{ secrets.PAGE_ID }}
      PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Autopilot Posting
        run: node autopilot.js
      - name: Run Comment Bot V8 AI
        run: node commentBot.js
