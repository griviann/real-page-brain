name: Real Satisfaction Autopilot V8 AI

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 9 * * *'
    - cron: '30 16 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  autopilot:
    runs-on: ubuntu-latest
    env:
      PAGE_ID: ${{ secrets.PAGE_ID }}
      PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Find files location
        run: |
          echo "=== LIST FILES ==="
          ls -R | head -n 100
          echo "=================="
      - name: Run Autopilot Posting
        run: |
          if [ -f "./autopilot.js" ]; then node ./autopilot.js
          elif [ -f "./real-page-brain/autopilot.js" ]; then node ./real-page-brain/autopilot.js
          elif [ -f "./src/autopilot.js" ]; then node ./src/autopilot.js
          else echo "Searching..." && find . -name "autopilot.js" -exec node {} \;
          fi
      - name: Run Comment Bot V8 AI
        run: |
          if [ -f "./commentBot.js" ]; then node ./commentBot.js
          elif [ -f "./real-page-brain/commentBot.js" ]; then node ./real-page-brain/commentBot.js
          elif [ -f "./src/commentBot.js" ]; then node ./src/commentBot.js
          else echo "Searching..." && find . -name "commentBot.js" -exec node {} \;
          fi
